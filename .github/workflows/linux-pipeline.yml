name: Linux Pipeline

on:
  workflow_call:
    inputs:
      compiler:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Build Container
    runs-on: ubuntu-latest
    outputs:
      container-image-adress: ${{ steps.build.outputs.container-image-adress }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        name: Build & Push
        uses: ./.github/actions/build-container
        with:
          dockerfile: ci/docker/linux/Dockerfile
          tag: linux-container

  build:
    name: Linux (${{ inputs.compiler }})
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.prepare.outputs.container-image-adress }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: >-
        -v /usr/local/share/vcpkg:/vcpkg
        -e VCPKG_ROOT=/vcpkg
      env:
        VCPKG_ROOT: /vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        uses: ./.github/actions/build-cth
        with:
          cache_prefix: linux
          preset: ci_linux_${{ inputs.compiler }}

      - name: Test
        uses: ./.github/actions/test-cth
        with:
          preset: ci_linux_${{ inputs.compiler }}
